# ~/.config/tmux/tmux.conf
# Tuned for Ghostty + Neovim. Reload after edits: prefix + r

# ============================================================================
# Ghostty + Neovim compatibility  (the important, non-obvious part)
# ============================================================================

# Truecolor: inside tmux use the full-capability tmux-256color terminfo, and
# tell tmux the OUTER terminal (Ghostty sets TERM=xterm-ghostty) supports RGB.
# Without this your GitHub Dark / github_dark theme looks washed-out in tmux.
set -g  default-terminal  "tmux-256color"
set -ag terminal-features "xterm-ghostty:RGB"
# Portable fallback: also mark any terminal as RGB-capable.
set -ag terminal-features ",*:RGB"

# Undercurl + colored underlines (Neovim LSP diagnostics squiggles)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -sg escape-time 10        # kill the ~500ms Esc lag in Neovim's modal editing
set -g  focus-events on       # Neovim autoread / FocusGained / FocusLost
set -g  allow-passthrough on  # let Neovim's OSC 52 / passthrough reach Ghostty (tmux 3.3+)
set -g  set-clipboard on      # yanks flow tmux -> Ghostty -> macOS clipboard (incl. over SSH)

# ============================================================================
# Ergonomics  (user-friendly defaults)
# ============================================================================

# Prefix: C-a is easier to reach than C-b. (Trade-off: Neovim's <C-a> increment
# is captured by tmux inside a session; change back to C-b here if you want it.)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on               # click panes, drag borders to resize, wheel-scroll
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # keep window numbers gapless when one closes
set -g history-limit 100000   # generous scrollback
set -g display-time 2000      # messages linger 2s
setw -g mode-keys vi          # vi keys in copy-mode

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Splits that keep the current directory, on intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy-mode: v to select, y to yank (tmux-yank sends it to the clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ============================================================================
# Look — mirrors Neovim's lualine (github_dark): layered blue-tinted blocks.
#   A accent  bg #58a6ff  fg #30363d   (prefix pending -> green #3fb950, like insert mode)
#   B info    bg #384c64  fg #5090d8
#   C main    bg #30373f  fg #7d97b8
# ============================================================================
set -g status on                              # single row (reset, in case it was set to 2)
set -g status-position bottom
set -g status-interval 15                     # slow refresh -> cheap git/clock
set -g status-justify left                    # mode block on the left, like lualine
set -g status-style "bg=#30373f,fg=#7d97b8"   # main bar = lualine_c bg
set -g status-left-length 60
set -g status-right-length 80

# LEFT: session in the accent "mode" block -> powerline arrow into the bar.
# Block turns green while the prefix (C-a) is pending (mirrors lualine insert mode).
set -g status-left "#{?client_prefix,#[bg=#3fb950],#[bg=#58a6ff]}#[fg=#30363d,bold] #S #[nobold]#{?client_prefix,#[fg=#3fb950],#[fg=#58a6ff]}#[bg=#30373f] "

# CENTER: window list on the main bar. Inactive dim, active accent + zoom glyph.
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#30373f,fg=#7d97b8] #I #W "
setw -g window-status-current-format "#[bg=#30373f,fg=#58a6ff,bold] #I #W#{?window_zoomed_flag,  ,} "

# RIGHT: git branch (dim, only in a repo) -> date block (B) -> clock block (A),
# separated by left powerline arrows.
set -g status-right "#[fg=#5090d8,bg=#30373f]#(cd '#{pane_current_path}' && b=$(git branch --show-current 2>/dev/null) && [ -n \"$b\" ] && echo \"  $b  \")#[fg=#384c64,bg=#30373f]#[bg=#384c64,fg=#5090d8] %d %b #[fg=#58a6ff,bg=#384c64]#[bg=#58a6ff,fg=#30363d,bold] %H:%M "
# Quick-help cheat sheet in a popup — prefix + ?  (readable, on-demand, no extra bar height).
bind ? display-popup -w 64 -h 30 -E "~/.config/tmux/help.sh"

# Borders: muted blue when inactive, bright blue when selected (both blue,
# but the active pane is clearly brighter + bold).
set -g pane-border-style        "fg=#3d5a80"
set -g pane-active-border-style  "fg=#58a6ff"
set -g message-style "bg=#30363d,fg=#c9d1d9"
set -g mode-style    "bg=#58a6ff,fg=#0d1117"   # copy-mode selection matches the accent

# Pane border titles: show a label on each split's top border.
# Uses the pane's custom title if set, otherwise the running command.
# Rename the focused pane with:  prefix + P
set -g pane-border-lines heavy   # thicker box-drawing lines (━┃) — crisper borders
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#58a6ff bold],#[fg=#7d97b8]} #{pane_index} #{?pane_title,#{pane_title},#{pane_current_command}} #[default]"
bind P command-prompt -p "pane name:" "select-pane -T '%%'"

# ============================================================================
# Plugins (TPM). Install/update: prefix + I  ·  update: prefix + U
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'          # universally-agreeable defaults
set -g @plugin 'tmux-plugins/tmux-yank'              # copy to system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'      # seamless C-h/j/k/l with Neovim
set -g @plugin 'tmux-plugins/tmux-resurrect'         # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # auto-save + restore on start

set -g @resurrect-strategy-nvim 'session'  # restore Neovim session state too
set -g @resurrect-processes '"~claude->claude --resume"'  # restore Claude, launched with --resume (session picker)
set -g @continuum-restore 'on'             # auto-restore the last session on launch

# Keep this line LAST.
run '~/.config/tmux/plugins/tpm/tpm'

# --- Overrides that must run AFTER plugins load ----------------------------
# vim-tmux-navigator binds C-j to "move to pane below" and only passes it
# through for vim/nvim. Claude Code uses C-j to insert a newline, so also pass
# it through when the pane is running `claude`. C-h/C-k/C-l stay as navigation,
# so you can still move out of the Claude pane.
is_vim_or_claude="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|l?n?vim?x?|fzf)|claude)(diff)?$'"
bind-key -n C-j if-shell "$is_vim_or_claude" 'send-keys C-j' 'select-pane -D'

# tmux-sensible resets status-interval to 5; re-assert our slower, cheaper value
# (clock is minutes + git branch changes rarely, so 15s is plenty and lighter).
set -g status-interval 15
